name: Weekly Audit

# Dependency audit on a schedule. Read-only by design: this workflow never
# pushes commits, opens PRs, or publishes anything (single-branch policy).
# A failure is the signal -- the owner triages and fixes on main.
on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  # Manual runs allowed; still read-only.
  workflow_dispatch:

# Least privilege: nothing here needs to write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: make audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run make audit (blocking)
        # make audit = pip-audit over the uv-locked backend set + npm audit
        # (frontend prod). Fails visibly on any HIGH/CRITICAL finding.
        run: make audit
