name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  DOCKER_REGISTRY: ghcr.io

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run MyPy (type check)
        # Baseline overrides live in backend/pyproject.toml [tool.mypy].
        run: mypy . --ignore-missing-imports

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        # Baseline config lives in frontend/.eslintrc.cjs.
        run: npx eslint src --ext .ts,.tsx

      - name: Run Prettier check
        # Style baseline lives in frontend/.prettierrc.
        run: npx prettier --check src

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sentinelasm_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinelpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U sentinel && break
            sleep 1
          done

      - name: Wait for Redis
        run: |
          for i in {1..10}; do
            redis-cli -h localhost -p 6379 ping && break
            sleep 1
          done

      - name: Set up test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE sentinelasm_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE USER sentinel WITH PASSWORD 'sentinelpass';"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE sentinelasm_test TO sentinel;"

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://sentinel:sentinelpass@localhost:5432/sentinelasm_test
          REDIS_URL: redis://localhost:6379/15
          JWT_SECRET: test-secret-key-for-ci
          # Test-only Fernet key (never production).
          SECRETS_ENCRYPTION_KEY: 65oXmy07q8CjkFHoNljDp294eAbZDmRN4bJd1Ax3lo8=
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://sentinel:sentinelpass@localhost:5432/sentinelasm_test
          REDIS_URL: redis://localhost:6379/15
          JWT_SECRET: test-secret-key-for-ci
          # Test-only Fernet key (never production).
          SECRETS_ENCRYPTION_KEY: 65oXmy07q8CjkFHoNljDp294eAbZDmRN4bJd1Ax3lo8=
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # frontend/package.json test script runs `vitest run` (no watch, no
        # coverage provider). Hard gate: no `|| true`.
        run: npm test

  dependency-scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pip-audit (Python)
        # Phase 0 baseline: two vulns with no fixed release, each ignored with
        # reason. Revisit in Phase 1 (PyJWT migration removes python-jose).
        # - CVE-2026-85394 (python-jose): HMAC key-confusion only when
        #   algorithms are not restricted. SentinelASM always passes explicit
        #   HS256 (auth/jwt.py encode/decode) and uses symmetric secrets only.
        # - PYSEC-2026-1325 (ecdsa, transitive via python-jose): P-256 timing
        #   side-channel in sign/keygen; verification is unaffected, the repo
        #   never calls the affected APIs, and upstream has no planned fix.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt \
            --ignore-vuln CVE-2026-85394 \
            --ignore-vuln PYSEC-2026-1325

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Prod dependencies only: dev-toolchain highs (brace-expansion via
      # eslint, braces via tailwind) need breaking majors (tailwind v4,
      # react-router-dom v7) and are deferred to Phase 1. The prod gate at
      # --audit-level=high is hard (axios fixed at 1.20.0).
      - name: Run npm audit (Frontend, prod only)
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned gitleaks action (v2 line). Uses .gitleaks.toml at the repo
      # root, which extends the default rules with a commented allowlist
      # covering only the deterministic test keys. Fails the job (and
      # therefore the workflow) on any other finding.
      - name: Run gitleaks (blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, test-frontend, dependency-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NOTE: the worker reuses the backend image (same Dockerfile, Celery
      # entrypoint comes from docker-compose.yml `command:`). backend/Dockerfile
      # has no `worker` stage, so the old `target: worker` build step was
      # removed instead of building a non-existent stage.

      - name: Extract metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/worker
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          # Same backend image with a Celery entrypoint (see note above).
          context: ./backend
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-pr:
    name: Build Docker Images (PR)
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, test-frontend, dependency-scan]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: sentinelasm/backend:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: sentinelasm/frontend:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker (no push)
        uses: docker/build-push-action@v5
        with:
          # Same backend image with a Celery entrypoint (see note above).
          context: ./backend
          push: false
          tags: sentinelasm/worker:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max