name: CI Pipeline

on:
  push:
    branches: [main, develop]
    # Release tags (v*) are the ONLY refs that publish images to ghcr
    # (see docker-publish). Without this, tag pushes would not trigger CI.
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  DOCKER_REGISTRY: ghcr.io

# Least privilege: read-only by default; jobs that publish declare more.
permissions:
  contents: read

# Cancel superseded runs (pushes and PR syncs) to save runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5

      - name: Install dependencies
        # Hash-enforced install from the uv lockfile (--frozen fails if
        # pyproject.toml and uv.lock disagree). Includes the dev group
        # (pytest, ruff, mypy) so later steps use the locked toolchain.
        run: uv sync --frozen --group dev

      - name: Run Ruff (lint)
        run: uv run --frozen ruff check .

      - name: Run MyPy (type check)
        # Baseline overrides live in backend/pyproject.toml [tool.mypy].
        run: uv run --frozen mypy . --ignore-missing-imports

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        # Baseline config lives in frontend/.eslintrc.cjs.
        run: npx eslint src --ext .ts,.tsx

      - name: Run Prettier check
        # Style baseline lives in frontend/.prettierrc.
        run: npx prettier --check src

  lint-workflows:
    name: Lint Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5

      - name: Install dependencies
        # actionlint-py is pinned exactly in the dev group
        # (actionlint-py==1.7.12.25, see backend/pyproject.toml) so CI and
        # `make lint-workflows` run the exact same tool version from uv.lock.
        run: uv sync --frozen --group dev
        working-directory: ./backend

      - name: Run actionlint
        run: cd backend && uv run --frozen actionlint

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sentinelasm_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinelpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5

      - name: Install dependencies
        # Same hash-enforced lockfile as lint-backend and Docker.
        run: uv sync --frozen --group dev

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U sentinel && break
            sleep 1
          done

      - name: Wait for Redis
        run: |
          for i in {1..10}; do
            redis-cli -h localhost -p 6379 ping && break
            sleep 1
          done

      - name: Set up test database
        # Idempotent repair, not provisioning: the postgres service entrypoint
        # already creates the sentinel superuser role and the sentinelasm_test
        # database (see services.postgres env above), so plain CREATE statements
        # would fail here with "already exists". Each statement below checks
        # first and only acts when something is missing. NOTE: the superuser
        # password is POSTGRES_PASSWORD (sentinelpass), not "postgres".
        run: |
          export PGPASSWORD=sentinelpass
          psql -h localhost -U sentinel -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'sentinel'" | grep -q 1 \
            || psql -h localhost -U postgres -d postgres -c "CREATE USER sentinel WITH PASSWORD 'sentinelpass' SUPERUSER;"
          psql -h localhost -U sentinel -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'sentinelasm_test'" | grep -q 1 \
            || psql -h localhost -U sentinel -d postgres -c "CREATE DATABASE sentinelasm_test OWNER sentinel;"
          psql -h localhost -U sentinel -d sentinelasm_test -c "GRANT ALL PRIVILEGES ON DATABASE sentinelasm_test TO sentinel;"
          psql -h localhost -U sentinel -d sentinelasm_test -tAc "SELECT 1;"

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://sentinel:sentinelpass@localhost:5432/sentinelasm_test
          REDIS_URL: redis://localhost:6379/15
          JWT_SECRET: test-secret-key-for-ci
          # Test-only Fernet key (never production).
          SECRETS_ENCRYPTION_KEY: 65oXmy07q8CjkFHoNljDp294eAbZDmRN4bJd1Ax3lo8=
        run: |
          uv run --frozen alembic upgrade head

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://sentinel:sentinelpass@localhost:5432/sentinelasm_test
          REDIS_URL: redis://localhost:6379/15
          JWT_SECRET: test-secret-key-for-ci
          # Test-only Fernet key (never production).
          SECRETS_ENCRYPTION_KEY: 65oXmy07q8CjkFHoNljDp294eAbZDmRN4bJd1Ax3lo8=
        run: |
          uv run --frozen pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # frontend/package.json test script runs `vitest run` (no watch, no
        # coverage provider). Hard gate: no `|| true`.
        run: npm test

  dependency-scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5

      - name: Run pip-audit (Python)
        # No baseline ignores: python-jose (and its transitive ecdsa) were
        # removed by the PyJWT migration, so the two former ignores
        # (CVE-2026-85394, PYSEC-2026-1325) are gone. Re-add with reason
        # comments if a future dependency needs one.
        # Audits the locked set: export first so duplicates/variants resolve
        # exactly as uv.lock pins them.
        run: |
          cd backend && uv export --frozen --no-dev --output-file /tmp/requirements.audit.txt
          pip install pip-audit
          pip-audit -r /tmp/requirements.audit.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Prod dependencies only: dev-toolchain highs (brace-expansion via
      # eslint, braces via tailwind) need breaking majors (tailwind v4,
      # react-router-dom v7) and are deferred to Phase 1. The prod gate at
      # --audit-level=high is hard (axios fixed at 1.20.0).
      - name: Run npm audit (Frontend, prod only)
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Pinned gitleaks action (v2 line). Uses .gitleaks.toml at the repo
      # root, which extends the default rules with a commented allowlist
      # covering only the deterministic test keys. Fails the job (and
      # therefore the workflow) on any other finding.
      - name: Run gitleaks (blocking)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lockfiles:
    name: Lockfile drift gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5

      # Fails if pyproject.toml and uv.lock disagree (run `make lock`).
      - name: Check uv lockfile is current
        working-directory: ./backend
        run: uv lock --check

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      # Fails if package.json and package-lock.json disagree.
      - name: Check npm lockfile installs cleanly
        working-directory: ./frontend
        run: npm ci --dry-run

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      # Pinned trivy-action (v0.36.0). Fails on HIGH/CRITICAL findings in
      # fixed vulnerabilities only; .trivyignore documents every exception.
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  text-integrity:
    name: Text integrity (NUL / UTF-8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      # stdlib-only gate born from the 2026-10-20 null-byte commit
      # (918ae86 / cbd7f6d): fails when any tracked text file contains a
      # NUL byte or invalid UTF-8. No setup step needed.
      - name: Scan tracked text files
        run: python3 scripts/check_text_integrity.py

  docker-build:
    name: Build Docker Images (no push)
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, test-frontend, dependency-scan]
    # Pushes to main and PRs verify the images build; nothing leaves the
    # runner (publishing happens only in docker-publish on v* tags).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=ci-scan

      - name: Build Backend (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: ./backend
          push: false
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=ci-scan

      - name: Build Frontend (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: ./frontend
          push: false
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NOTE: the worker reuses the backend image (same Dockerfile, Celery
      # entrypoint comes from docker-compose.yml `command:`). backend/Dockerfile
      # has no `worker` stage, so the old `target: worker` build step was
      # removed instead of building a non-existent stage.

      - name: Extract metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/worker
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=ci-scan

      - name: Build Worker (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          # Same backend image with a Celery entrypoint (see note above).
          context: ./backend
          push: false
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image scans fail on HIGH/CRITICAL fixed vulnerabilities. The images
      # above are local-only (push: false); ci-scan tags address them
      # deterministically. Same .trivyignore as the filesystem gate.
      - name: Scan Backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/backend:ci-scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - name: Scan Frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/frontend:ci-scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - name: Scan Worker image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/worker:ci-scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  docker-publish:
    name: Publish Docker Images (v* tags only)
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, test-frontend, dependency-scan]
    # Release tags are the sole publishing path: push a v* tag to ship
    # ghcr.io/<repo>/{backend,frontend,worker}:{version} (+ sha).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/worker
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Worker
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          # Same backend image with a Celery entrypoint (see note above).
          context: ./backend
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CycloneDX SBOMs of exactly what was published (tag builds only).
      - name: SBOM Backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/backend:${{ github.ref_name }}
          format: cyclonedx
          output: sbom-backend.json

      - name: SBOM Frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/frontend:${{ github.ref_name }}
          format: cyclonedx
          output: sbom-frontend.json

      - name: SBOM Worker image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/worker:${{ github.ref_name }}
          format: cyclonedx
          output: sbom-worker.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-${{ github.ref_name }}
          path: |
            sbom-backend.json
            sbom-frontend.json
            sbom-worker.json