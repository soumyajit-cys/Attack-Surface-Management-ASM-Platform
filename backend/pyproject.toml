[project]
name = "sentinelasm-backend"
version = "0.1.0"
description = "SentinelASM FastAPI backend (moved from requirements.txt; see uv.lock)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    # SQLAlchemy >= 2.1 defaults to the psycopg (v3) driver for postgresql://
    # URLs, so fresh installs also need it (clean clones got
    # ModuleNotFoundError: psycopg).
    "psycopg[binary]",
    "celery",
    "redis",
    "pydantic[email]",
    "pydantic-settings",
    "PyJWT==2.15.1",
    # TOTP 2FA (RFC 6238 verification; constant-time compare internally).
    "pyotp==2.10.0",
    "bcrypt",
    # Fernet encryption for secrets at rest (alert integration credentials).
    "cryptography",
    "httpx",
    "dnspython",
    "python-whois",
    "requests",
    # Public Suffix List for ownership verification (reject verifying bare
    # suffixes like co.uk / github.io). Used with suffix_list_urls=None so
    # only the bundled snapshot is consulted -- no runtime network fetch.
    "tldextract",
    # Rate limiting (was missing -- fresh installs failed at startup).
    "slowapi>=0.1.9",
    # PDF report generation (was missing -- PDF endpoints returned 501).
    "fpdf2>=2.7",
    # Cron expression evaluation for scan-policy scheduling (Celery Beat).
    "croniter>=1.4.0",
    "prometheus-client",
    # Compose-contract tests parse docker-compose.yml.
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.uv]
package = false
