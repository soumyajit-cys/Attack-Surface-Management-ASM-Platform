[project]
name = "sentinelasm-backend"
version = "0.1.0"
description = "SentinelASM FastAPI backend (moved from requirements.txt; see uv.lock)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.3",
    # Pinned: >=0.143 nests included routers (_IncludedRouter) instead of
    # flattening app.routes, which silently disables slowapi's per-route
    # handler lookup (all API routes become limiter-exempt) and breaks our
    # route-table introspection tests. Re-evaluate on 0.144+.
    # Do not bump without running tests/v3/test_rate_limits.py (proves the
    # global limiter still applies) and test_route_table_complete in
    # tests/v3/test_tenant_matrix.py (proves routes still flatten);
    # 0.143.1 silently disabled slowapi and both caught it.
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    # SQLAlchemy >= 2.1 defaults to the psycopg (v3) driver for postgresql://
    # URLs, so fresh installs also need it (clean clones got
    # ModuleNotFoundError: psycopg).
    "psycopg[binary]",
    "celery",
    "redis",
    "pydantic[email]",
    "pydantic-settings",
    "PyJWT==2.15.1",
    # TOTP 2FA (RFC 6238 verification; constant-time compare internally).
    "pyotp==2.10.0",
    "bcrypt",
    # Fernet encryption for secrets at rest (alert integration credentials).
    "cryptography",
    "httpx",
    "dnspython",
    "python-whois",
    "requests",
    # Public Suffix List for ownership verification (reject verifying bare
    # suffixes like co.uk / github.io). Used with suffix_list_urls=None so
    # only the bundled snapshot is consulted -- no runtime network fetch.
    "tldextract",
    # Rate limiting (was missing -- fresh installs failed at startup).
    "slowapi>=0.1.9",
    # PDF report generation (was missing -- PDF endpoints returned 501).
    "fpdf2>=2.7",
    # Cron expression evaluation for scan-policy scheduling (Celery Beat).
    "croniter>=1.4.0",
    "prometheus-client",
    # Compose-contract tests parse docker-compose.yml.
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    # Pinned CI-workflow linter (used by `make lint-workflows` and its CI job).
    # Upgraded deliberately, with the pin bumped in the same commit. Marker:
    # upstream publishes wheels only up to the 3.14 series, so exclude the
    # unpublished >= 3.15 interpreter space from resolution.
    "actionlint-py==1.7.12 ; python_full_version < '3.15'",
]

[tool.uv]
package = false

# Phase 0 baseline (2026-10-06): lint/type baselines to get CI green without
# hiding failures behind `|| true`. Each ignore below names the rule and why
# it is deferred; re-enable incrementally in Phase 1.
# Baseline counts: `ruff check .` reported 662 errors,
# `mypy . --ignore-missing-imports` reported 271 errors in 38 files.

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  # Function call in default argument: FastAPI Query()/Field() use it by design.
  "B008",
  # Blind except / try-except-pass / try-except-continue: scanners and tasks
  # fail soft intentionally (every handler logs). Tighten per-module in Phase 1.
  "BLE001",
  "S110",
  "S112",
  # Unused imports/variables/redefinitions: largely legacy re-export shims and
  # duplicated legacy/v1 surfaces, removed under task 0.4.
  "F401",
  "F841",
  "F811",
  # Import sorting: not enforced yet; run `ruff check --fix` in Phase 1.
  "I001",
  # pyupgrade rewrites (Optional->X|None, Union->|, etc.): automated fix in Phase 1.
  "UP006",
  "UP007",
  "UP035",
  "UP045",
  # Ruff-specific nits (explicit f-string conversion, implicit Optional,
  # unsorted dunder, unused unpacked variable): deferred.
  "RUF010",
  "RUF013",
  "RUF022",
  "RUF059",
  # Small simplifications (collapsible if, needless bool, multiple with):
  # deferred, no behavior impact.
  "SIM102",
  "SIM103",
  "SIM117",
  # Style nits (implicit concat, unnecessary collection call, needless return
  # None): deferred.
  "ISC004",
  "C408",
  "RET501",
  # Datetime tz-naive calls: data-model tz work lands under task 0.5
  # (ssl_results.expires_at migration); re-enable after.
  "DTZ005",
  "DTZ901",
  # Blocking HTTP call in async function: `requests` is used inside Celery sync
  # task context via _run_async(); header scans already use httpx.
  "ASYNC210",
  # pyupgrade batch (datetime.timezone.utc->UTC, TimeoutError alias, default
  # type args, PEP-695 generics): automated `ruff check --fix` in Phase 1.
  "UP017",
  "UP041",
  "UP043",
  "UP046",
  # fromisoformat z-suffix handling: review with 0.5 tz work in Phase 1.
  "FURB162",
  # Unused noqa directives: stale `# noqa` cleanup lands with the 0.4 legacy
  # removal; re-enable after.
  "RUF100",
]

[tool.mypy]
ignore_missing_imports = true
# 271 errors at baseline, dominated by SQLAlchemy classic Column[...] typing
# (arg-type/assignment/return-value): models use legacy Column() style so
# attributes report as Column[...] instead of plain types. Migrating models to
# SQLAlchemy 2.0 Mapped[] typing is Phase 1 work; re-enable codes incrementally.
disable_error_code = "arg-type, assignment, index, return-value, var-annotated, call-overload, operator, attr-defined, union-attr, misc, call-arg"
