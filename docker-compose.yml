name: sentinelasm

services:
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    networks:
      - sentinelnet
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelasm}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinelasm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    restart: unless-stopped
    networks:
      - sentinelnet
    # Auth is mandatory in the bundled stack (was wide open). REDIS_PASSWORD
    # is generated by scripts/bootstrap.sh into .env and never printed.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (run make setup)}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (run make setup)}"]
    volumes:
      - redisdata:/data
    healthcheck:
      # REDISCLI_AUTH keeps the secret out of `redis-cli -a` argv.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    networks:
      - sentinelnet
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sentinel:sentinelpass@postgres:5432/sentinelasm}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env (run make setup; embeds REDIS_PASSWORD)}
      KEV_CACHE_DIR: /kev-cache
    volumes:
      - kevdata:/kev-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    networks:
      - sentinelnet
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sentinel:sentinelpass@postgres:5432/sentinelasm}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env (run make setup; embeds REDIS_PASSWORD)}
      KEV_CACHE_DIR: /kev-cache
    volumes:
      - kevdata:/kev-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["celery", "-A", "workers.celery_app", "worker", "-l", "info", "-Q", "scans,celery"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    build: ./backend
    restart: unless-stopped
    networks:
      - sentinelnet
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sentinel:sentinelpass@postgres:5432/sentinelasm}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env (run make setup; embeds REDIS_PASSWORD)}
      KEV_CACHE_DIR: /kev-cache
    volumes:
      - kevdata:/kev-cache
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["celery", "-A", "workers.celery_app", "beat", "-l", "info", "--schedule=/tmp/celerybeat-schedule"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks:
      - sentinelnet
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    # Unprivileged variant (uid 101, listens on 8080/8443 in-container).
    # Digest from the Docker Hub registry v2 API manifest list for tag 1.27-alpine.
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    restart: unless-stopped
    networks:
      - sentinelnet
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS + ACME webroot (see nginx/nginx.conf for provisioning steps).
      # - ./certbot/conf:/etc/nginx/certs:ro
      # - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  kevdata:

networks:
  sentinelnet:
    name: sentinelasm_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
