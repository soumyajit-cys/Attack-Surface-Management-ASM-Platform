# Serves the built Vite SPA (dist/). API traffic is proxied by the
# top-level reverse proxy, so this server only handles static assets
# plus the SPA fallback to index.html for client-side routing.
server {
    # Unprivileged port: the nginx-unprivileged base runs as uid 101 and
    # cannot bind 80. Compose healthcheck and the reverse proxy both target
    # 8080; the host port mapping stays in docker-compose.yml.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache-busted Vite assets (dist/assets/*) are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
