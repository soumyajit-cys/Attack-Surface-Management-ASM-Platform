# SentinelASM reverse proxy.
#
# - Serves the React SPA via the `frontend` service.
# - Proxies /api/*, /health and /metrics to the FastAPI `backend`.
#
# TLS-ready: terminate TLS here in production. Either
#  1. mount certificates at /etc/nginx/certs (see commented 443 block below)
#     and set SERVER_NAME, or
#  2. put a managed load balancer / certbot sidecar in front and keep this
#     listener on port 80.
#
# With certbot (webroot):
#   certbot certonly --webroot -w /var/www/certbot -d example.com
# then uncomment the 443 server block and mount:
#   volumes:
#     - ./certbot/conf:/etc/nginx/certs:ro
#     - ./certbot/www:/var/www/certbot:ro

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # ACME HTTP-01 challenge path (used by certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Backend API + health + metrics.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics {
        # Restrict in production (allowlist your Prometheus scraper).
        # allow 10.0.0.0/8; deny all;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → React SPA.
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

