# SentinelASM reverse proxy.
#
# - Serves the React SPA via the `frontend` service.
# - Proxies /api/*, /health and /metrics to the FastAPI `backend`.
#
# TLS-ready: terminate TLS here in production. Either
#  1. mount certificates at /etc/nginx/certs (see commented 443 block below)
#     and set SERVER_NAME, or
#  2. put a managed load balancer / certbot sidecar in front and keep this
#     listener on port 80.
#
# With certbot (webroot):
#   certbot certonly --webroot -w /var/www/certbot -d example.com
# then uncomment the 443 server block and mount:
#   volumes:
#     - ./certbot/conf:/etc/nginx/certs:ro
#     - ./certbot/www:/var/www/certbot:ro

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:8080;  # unprivileged listener (see frontend/nginx.conf)
}

server {
    # Unprivileged port: the proxy also runs as a non-root user
    # (nginx-unprivileged, uid 101). Host port mapping lives in
    # docker-compose.yml (${HTTP_PORT:-80}:8080).
    listen 8080;
    server_name _;

    # Don't advertise the nginx version in the Server header.
    server_tokens off;

    client_max_body_size 10m;

    # Baseline security headers on every response (API JSON included).
    # add_header only cascades into locations that define none of their
    # own, so the SPA and SSE locations below repeat these explicitly.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ACME HTTP-01 challenge path (used by certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Live scan progress event stream (SSE) needs unbuffered proxying and a
    # long read timeout: buffering would hold heartbeats back and the 60 s
    # default read timeout would kill idle streams mid-flight.
    location ~ ^/api/v1/scans/[0-9]+/events$ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
        # This location's own add_header disables inheritance — repeat the
        # baseline headers here (SSE never renders, so no CSP/X-Frame).
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Live scan progress WebSocket. WebSocket upgrades need HTTP/1.1 and the
    # Upgrade/Connection hop-by-hop headers forwarded, plus a long read timeout
    # so idle streams are not killed mid-flight. Same origin-scoping and auth
    # as the SSE endpoint (enforced by the backend).
    location ~ ^/api/v1/scans/[0-9]+/ws$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # add_header does not cascade into locations with their own, so repeat
        # the baseline headers here.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Backend API + health + metrics.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics {
        # Deny by default at the edge too: the backend gates /metrics by
        # bearer token or peer CIDR, and the public proxy exposes nothing.
        return 404;
    }

    # Everything else → React SPA.
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rendering protections live only on the SPA (API JSON never
        # renders). Google Fonts allowances match index.html; inline style
        # attributes from React/Tailwind need 'unsafe-inline' on styles.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }
}

